[package]
name = "trames-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
trames-shared = { workspace = true }
trames-wayland = { workspace = true }
trames-core = { path = "../trames-core" }
trames-linux = { workspace = true }
trames-vfs = { workspace = true }
trames-distro = { workspace = true }
trames-bridge = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"

# Only the C byte-buffer boundary permits unsafe code. The worker is safe Rust.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
