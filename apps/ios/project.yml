name: Trames
options:
  bundleIdPrefix: org.trames
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../target/ios-link/$(TRAMES_RUST_TARGET)']
    'TRAMES_RUST_TARGET[sdk=iphoneos*]': aarch64-apple-ios
    'TRAMES_RUST_TARGET[sdk=iphonesimulator*]': aarch64-apple-ios-sim
    MARKETING_VERSION: '0.15.0'
    CURRENT_PROJECT_VERSION: '16'
    INFOPLIST_KEY_CFBundleShortVersionString: '$(MARKETING_VERSION)'
    INFOPLIST_KEY_CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    INFOPLIST_KEY_CFBundleDisplayName: Trames
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to SSH servers and development services on your local network.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    CODE_SIGN_STYLE: Automatic
packages:
  TramesKit:
    path: TramesKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
targets:
  Trames:
    type: application
    platform: iOS
    sources:
      - path: Trames
        excludes: [GuestMusl, GuestVulkan]
      - path: Trames/GuestMusl
        type: folder
        buildPhase: resources
      - path: Trames/GuestVulkan
        type: folder
        buildPhase: resources
    dependencies:
      - package: TramesKit
      - package: SwiftTerm
      # A Rust staticlib bundles MoltenVK's objects, but its system link flags
      # do not propagate to Xcode's final Swift executable link.
      - sdk: Metal.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trames.Trames
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../target/ios-link/$(TRAMES_RUST_TARGET)']
        'TRAMES_RUST_TARGET[sdk=iphoneos*]': aarch64-apple-ios
        'TRAMES_RUST_TARGET[sdk=iphonesimulator*]': aarch64-apple-ios-sim
        OTHER_LDFLAGS: ['$(inherited)', '-ltrames_ffi', '-lresolv', '-lc++']
  TramesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TramesTests]
    dependencies:
      - target: Trames
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trames.TramesTests
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
  TramesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TramesUITests]
    dependencies:
      - target: Trames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trames.TramesUITests
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
schemes:
  Trames:
    build:
      targets:
        Trames: all
    test:
      targets: [TramesTests, TramesUITests]
    run:
      config: Debug
