name: Publish Trames 1.3.0 release
on:
  push:
    branches: [main]
    paths: ['docs/validation/ipad-1.3-build35.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trames-build35-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish existing verified IPA and paired sources as release 1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-ios-build35.py
