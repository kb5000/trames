name: Publish iPad release
on:
  workflow_dispatch:
    inputs:
      apple_run:
        description: Successful iPad frontend run to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trames-ipad-release-0.15
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify both workflows and publish the requested version
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RUN: ${{ inputs.apple_run }}
        run: >-
          python3 scripts/publish-ios-release.py --repository "$GITHUB_REPOSITORY"
          --apple-run "$APPLE_RUN" --allow-version 0.15.0
          --allow-source 18f74153732a8010b611f441accfbed7ab337c28
