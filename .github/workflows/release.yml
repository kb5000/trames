name: Publish iPad release
on:
  workflow_run:
    workflows: [iPad frontend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apple_run:
        description: Successful iPad frontend run to publish
        required: true
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, scripts/publish-ios-release.py]
permissions:
  contents: read
concurrency:
  group: trames-ipad-release-0.14
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify both workflows and publish the requested version
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RUN: ${{ github.event.workflow_run.id || inputs.apple_run || '38563169660' }}
        run: >-
          python3 scripts/publish-ios-release.py --repository "$GITHUB_REPOSITORY"
          --apple-run "$APPLE_RUN" --allow-version 0.14.0
