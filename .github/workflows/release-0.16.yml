name: Publish iPad 0.16 release
on:
  workflow_dispatch:
    inputs:
      apple_run:
        description: Successful iPad frontend run to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trames-ipad-release-0.16
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify both workflows and publish the requested version
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RUN: ${{ inputs.apple_run }}
        run: >-
          python3 scripts/publish-ios-release-0.16.py --repository "$GITHUB_REPOSITORY"
          --apple-run "$APPLE_RUN" --allow-version 0.16.0
          --allow-source 24b9a945c115adea7e6940120d7cab33299dfa4f
