name: Publish iPad 0.16 release
on:
  push:
    branches: [main]
    paths: ['scripts/publish-ios-release-0.16.py', '.github/workflows/release-0.16.yml']
  workflow_run:
    workflows: [iPad frontend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apple_run:
        description: Successful iPad frontend run to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: trames-ipad-release-0.16
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify both workflows and publish the requested version
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RUN: ${{ github.event.workflow_run.id || inputs.apple_run || '38884960115' }}
        run: >-
          python3 scripts/publish-ios-release-0.16.py --repository "$GITHUB_REPOSITORY"
          --apple-run "$APPLE_RUN" --allow-version 0.16.0
          --allow-source 24b9a945c115adea7e6940120d7cab33299dfa4f
