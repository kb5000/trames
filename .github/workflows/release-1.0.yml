name: Publish Trames 1.0.0
on:
  workflow_run:
    workflows: [iPad frontend]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: trames-ipad-release-1.0
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact tested sources, IPA, licenses and publish 1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-ios-release-1.0.py --repository "$GITHUB_REPOSITORY"
