name: Publish Trames 1.0.0
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trames-ipad-release-1.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact tested sources, IPA, licenses and publish 1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-ios-release-1.0.py --repository "$GITHUB_REPOSITORY"
