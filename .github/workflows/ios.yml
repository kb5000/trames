name: iPad clean test IPA build 35
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ipad-clean-build35
  cancel-in-progress: false
jobs:
  clean-device:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          targets: aarch64-apple-ios
      - name: Verify frozen production source and unchanged guest inputs
        run: |
          git diff --exit-code 4eb3a46131b98ebfb30919eade07f3b9b8b1f86b HEAD -- crates Cargo.toml Cargo.lock vendor .cargo rust-toolchain.toml resources apps/ios/Trames apps/ios/TramesKit include
          git diff --exit-code 534e223e284df48f207500e84ab4cd05dd3d3958 HEAD -- accelerator/musl accelerator/guest crates/trames-native/upstream scripts/build-musl-hybrid.sh scripts/prepare-musl-hybrid.py scripts/prepare-vulkan.py scripts/vulkan-upstream.json LICENSE
          git diff --exit-code 18162c9c53ba1d8334b227087cbfd1474633bb2e HEAD -- crates/trames-vulkan crates/trames-wayland crates/trames-compute crates/trames-shared patches/mesa scripts/build-zink-egl.py scripts/zink-egl-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: full-musl-library-and-source
          run-id: 39015795319
          github-token: ${{ github.token }}
          path: target/musl-hybrid
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-compute-driver-and-native-source
          run-id: 39015795319
          github-token: ${{ github.token }}
          path: target/vulkan-guest
      - uses: actions/download-artifact@v4
        with:
          name: zink-native-bundle
          run-id: 39264897300
          github-token: ${{ github.token }}
          path: target/zink-native-bundle
      - name: Verify and install source-paired production graphics libraries
        run: python3 scripts/prepare-zink-ipa.py
      - uses: actions/upload-artifact@v4
        with:
          name: build35-corresponding-guest-sources
          path: |
            target/vulkan-guest/*source*.tar.gz
            target/vulkan-guest/*manifest.json
            target/vulkan-guest/ipa-guest-reuse.json
            target/musl-hybrid/*source*.tar.gz
            target/musl-hybrid/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Install Xcode project generator
        run: brew install xcodegen
      - name: Check Apple Core including latest seccomp fix
        run: cargo test -p trames-core --lib --locked
      - name: Build optimized iPad device app without DEBUG probes
        run: bash scripts/build-ios.sh device
      - name: Package clean device IPA
        run: |
          python3 scripts/package-ios.py apps/ios/build/device/Build/Products/Release-iphoneos/Trames.app apps/ios/build/sideload/Trames-1.2.0-build35-unsigned.ipa
          python3 - <<'PYCODE'
          import json, pathlib, plistlib, subprocess, zipfile
          output=pathlib.Path('apps/ios/build/sideload')
          ipa=output/'Trames-1.2.0-build35-unsigned.ipa'
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None
              names=archive.namelist()
              assert not any('/GuestVulkan/acceptance/' in name or '/GuestVulkan/wayland-acceptance/' in name or '.xctest/' in name or '.dSYM/' in name for name in names)
              info=plistlib.loads(archive.read('Payload/Trames.app/Info.plist'))
              assert info['CFBundleVersion']=='35' and info['CFBundleShortVersionString']=='1.2.0'
          binary=pathlib.Path('apps/ios/build/device/Build/Products/Release-iphoneos/Trames.app/Trames')
          symbols=subprocess.check_output(['nm',str(binary)],text=True)
          assert 'LocalWaylandProbe' not in symbols and 'LocalNetworkProbe' not in symbols
          report=dict(version='1.2.0',build=35,source_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),production_base='4eb3a46131b98ebfb30919eade07f3b9b8b1f86b',configuration='Release',debug_probes_included=False,guest_acceptance_fixtures_included=False,runtime_modified=False,pid1='Production BusyBox ash terminal supervisor retained',physical_ipad_tested=False)
          (output/'build35-package-checks.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Trames-1.2.0-build35-clean-unsigned
          path: apps/ios/build/sideload/*
          if-no-files-found: error
          retention-days: 14
