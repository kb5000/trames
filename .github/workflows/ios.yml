name: iPad frontend
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  apple-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build native Rust embedding library
        run: cargo build -p trames-ffi --features cpp --release --locked
      - name: Test native SSH PTY and SFTP against OpenSSH
        env:
          TRAMES_RUST_LIB_DIR: ${{ github.workspace }}/target/release
        run: bash scripts/test-swift-ssh.sh
      - name: Generate Xcode project
        run: brew install xcodegen
      - name: Link unsigned iPad simulator app
        run: bash scripts/build-ios.sh simulator
      - name: Link unsigned iPad device app
        run: bash scripts/build-ios.sh device
      - name: Test viewport, native consent, real gateway DNS/HTTPS and lifecycle in iPad simulator
        timeout-minutes: 12
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for rows in devices.values() for d in rows if d["name"].startswith("iPad")))')
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=180)' "$device_id"
          xcodebuild -project apps/ios/Trames.xcodeproj -scheme Trames -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath apps/ios/build/simulator \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 360 \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -resultBundlePath apps/ios/build/ipad-smoke.xcresult test \
            2>&1 | tee apps/ios/build/ipad-smoke.log
      - name: Export simulator test summary
        if: always()
        run: |
          if [[ -d apps/ios/build/ipad-smoke.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path apps/ios/build/ipad-smoke.xcresult \
              > apps/ios/build/ipad-smoke-summary.json
            cat apps/ios/build/ipad-smoke-summary.json
            python3 -c 'import json; s=json.load(open("apps/ios/build/ipad-smoke-summary.json")); assert s["failedTests"] == 0 and s["passedTests"] > 0, "The actual simulator test report did not pass"'
          fi
      - name: Package unsigned device IPA for sideload signing
        run: |
          python3 scripts/package-ios.py \
            apps/ios/build/device/Build/Products/Debug-iphoneos/Trames.app \
            apps/ios/build/sideload/Trames-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Trames-unsigned-sideload
          path: apps/ios/build/sideload/Trames-unsigned.ipa*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-ipad-build-and-project
          path: |
            apps/ios/Trames.xcodeproj
            apps/ios/build/*/Logs/Build
            apps/ios/build/ipad-smoke.xcresult
            apps/ios/build/ipad-smoke.log
            apps/ios/build/ipad-smoke-summary.json
            apps/ios/build/*/Build/Products/Debug-*/*.app
          retention-days: 7
