name: Linux runtime
on:
  push:
    branches: [main]
    paths-ignore: ['apps/ios/**', 'docs/**', '.github/workflows/ios.yml', 'scripts/ios-ci-scope.py', '.github/workflows/linux.yml']
  pull_request:
    paths-ignore: ['apps/ios/**', 'docs/**', '.github/workflows/ios.yml', 'scripts/ios-ci-scope.py', '.github/workflows/linux.yml']
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      frontend_only: ${{ steps.scope.outputs.frontend_only }}
      targeted: ${{ steps.scope.outputs.targeted }}
      skip_native: ${{ steps.scope.outputs.skip_linux_native }}
      skip_modules: ${{ steps.scope.outputs.skip_linux_modules }}
      native_scope: ${{ steps.scope.outputs.native_scope }}
      storage_proc_only: ${{ steps.scope.outputs.storage_proc_only }}
      isolation_retry: ${{ steps.scope.outputs.isolation_retry }}
      network_retry: ${{ steps.scope.outputs.network_retry }}
      docker_bridge: ${{ steps.scope.outputs.docker_bridge }}
      nftables: ${{ steps.scope.outputs.nftables }}
      docker_network: ${{ steps.scope.outputs.docker_network }}
      docker_network_retry: ${{ steps.scope.outputs.docker_network_retry }}
      docker_network_virtual_retry: ${{ steps.scope.outputs.docker_network_virtual_retry }}
      docker_default_remount: ${{ steps.scope.outputs.docker_default_remount }}
      zink_skip_linux_checks: ${{ steps.scope.outputs.zink_skip_linux_checks }}
      zink_sync_skip_linux: ${{ steps.scope.outputs.zink_sync_skip_linux }}
      zink_egl_only: ${{ steps.scope.outputs.zink_egl_only }}
      zink_egl_skip_apple_checks: ${{ steps.scope.outputs.zink_egl_skip_apple_checks }}
      zink_wayland_linux_run: ${{ steps.scope.outputs.zink_wayland_linux_run }}
      zink_wayland_linux_sha: ${{ steps.scope.outputs.zink_wayland_linux_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          TRAMES_FULL_CHECK: 'false'
          TRAMES_VALIDATION_WORKFLOW: linux.yml
          TRAMES_NEEDS_GUEST_ARTIFACTS: 'false'
        run: python3 scripts/ios-ci-scope.py
  zink-wayland-linux:
    needs: scope
    if: needs.scope.outputs.native_scope == 'zink-wayland' && needs.scope.outputs.zink_wayland_linux_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Prepare original signed Mesa and Wayland EGL clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu libvulkan-dev mesa-vulkan-drivers libwayland-bin pkg-config bison flex ninja-build python3-venv patch
          bash scripts/build-vulkan-guest.sh
          python3 scripts/prepare-zink-guest.py --wayland
          python3 -m venv target/mesa-tools
          target/mesa-tools/bin/pip install -r scripts/zink-egl-requirements.txt
          export PATH="$PWD/target/mesa-tools/bin:$PATH"
          python3 scripts/build-zink-egl.py
      - name: Check affected Vulkan module and build production embedding
        run: |
          cargo fmt --all --check
          if [[ '${{ needs.scope.outputs.zink_egl_only }}' != true ]]; then
            cargo clippy -p trames-vulkan --all-targets --locked -- -D warnings
            cargo test -p trames-vulkan --lib --locked
          fi
          cargo clippy -p trames-distro -p trames-ffi --all-targets --locked -- -D warnings
          cargo test -p trames-distro vulkan --locked
          cargo build -p trames-cli -p trames-ffi --release --locked
          python3 -m py_compile scripts/prepare-zink-guest.py scripts/prepare-zink-native-bundle.py tests/integration/zink-wayland.py
      - name: Verify GPU image copies and original Mesa window lifecycle
        run: |
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          export TRAMES_ZINK_CPU_REFERENCE=1
          mkdir -p target/zink-wayland-native
          target/zink-inputs/vulkan-copy-host | tee target/zink-wayland-native/image-copy.log
          python3 tests/integration/zink-wayland.py --output target/zink-wayland --snapshot-store target/zink-native-bundle/store
          python3 scripts/prepare-zink-native-bundle.py --wayland
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zink-wayland-evidence
          path: |
            target/zink-wayland/*.json
            target/zink-wayland/*.log
            target/zink-wayland/*.stdout
            target/zink-wayland/*.stderr
            target/zink-wayland-native/
            target/zink-inputs/inputs.json
            target/vulkan-guest/manifest.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zink-native-bundle
          path: target/zink-native-bundle/
          include-hidden-files: true
          retention-days: 3
  zink-wayland-apple:
    needs: [scope, zink-wayland-linux]
    if: always() && needs.scope.result == 'success' && needs.scope.outputs.native_scope == 'zink-wayland' && (needs.zink-wayland-linux.result == 'success' || needs.zink-wayland-linux.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          targets: aarch64-apple-ios
          components: clippy
      - uses: actions/download-artifact@v4
        with:
          name: zink-native-bundle
          github-token: ${{ github.token }}
          run-id: ${{ needs.scope.outputs.zink_wayland_linux_run || github.run_id }}
          path: target/zink-native-bundle
      - name: Verify exact guest inputs and Apple embedding
        run: |
          python3 scripts/prepare-zink-native-bundle.py --verify --source-sha '${{ needs.scope.outputs.zink_wayland_linux_sha || github.sha }}'
          if [[ '${{ needs.scope.outputs.zink_egl_only }}' != true ]]; then
            cargo clippy -p trames-vulkan --all-targets --locked -- -D warnings
            cargo test -p trames-vulkan --lib --locked
          fi
          if [[ '${{ needs.scope.outputs.zink_egl_skip_apple_checks }}' != true ]]; then
            cargo clippy -p trames-distro -p trames-ffi --all-targets --no-deps --locked -- -D warnings
            cargo test -p trames-distro vulkan --locked
            cargo check -p trames-ffi --target aarch64-apple-ios --locked
          fi
      - name: Verify original Mesa Wayland EGL on exported Metal textures
        run: |
          python3 scripts/prepare-vulkan.py --apple
          export TRAMES_MOLTENVK_STATIC_DIR="$PWD/target/vulkan-upstream/moltenvk-all/MoltenVK/MoltenVK/static/MoltenVK.xcframework/macos-arm64_x86_64"
          export MACOSX_DEPLOYMENT_TARGET=12.0
          export RUSTFLAGS="-C link-arg=-framework -C link-arg=IOKit -C link-arg=$(xcrun clang --print-runtime-dir)/libclang_rt.osx.a"
          cargo build -p trames-ffi --release --locked
          xcrun clang -O2 -Wall -Wextra -Werror -fobjc-arc -dynamiclib tests/fixtures/zink-metal-pixels.m -framework Metal -framework Foundation -o target/zink-metal-pixels.dylib
          export TRAMES_VULKAN_TRACE=1
          lldb --batch -o 'settings set target.process.stop-on-exec false' -o run -k 'thread backtrace all' -- "$(command -v python3)" tests/integration/zink-wayland.py --store target/zink-native-bundle/store --output target/zink-wayland-metal --metal-validator target/zink-metal-pixels.dylib 2>&1 | tee target/zink-metal-debug.log
          python3 -c 'import json; assert json.load(open("target/zink-wayland-metal/results.json"))["passed"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zink-wayland-metal-evidence
          path: |
            target/zink-wayland-metal/*.json
            target/zink-wayland-metal/*.log
            target/zink-metal-debug.log
            target/zink-native-bundle/checksums.json
          retention-days: 14
  zink-foundation:
    needs: scope
    if: (needs.scope.outputs.native_scope == 'zink-foundation' || needs.scope.outputs.native_scope == 'zink-sync' || needs.scope.outputs.native_scope == 'zink-gles') && needs.scope.outputs.zink_sync_skip_linux != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Prepare original guest ICD and signed Mesa clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu libvulkan-dev mesa-vulkan-drivers glslang-tools
          mkdir -p target/alpine-download
          curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o target/alpine-download/alpine-minirootfs-3.22.6-aarch64.tar.gz
          bash scripts/build-vulkan-fixtures.sh
          python3 scripts/prepare-zink-guest.py
      - name: Check bundle metadata and build unchanged native backend
        if: needs.scope.outputs.native_scope == 'zink-foundation' && needs.scope.outputs.zink_skip_linux_checks != 'true'
        run: |
          cargo fmt --all --check
          cargo clippy -p trames-distro --all-targets --locked -- -D warnings
          cargo test -p trames-distro vulkan --locked
          cargo build -p trames-cli -p trames-ffi --release --locked
          python3 -m py_compile scripts/prepare-zink-guest.py tests/integration/zink-foundation.py
          python3 tests/integration/embedding-reopen.py
      - name: Build unchanged runner for remaining graphics checks
        if: needs.scope.outputs.native_scope == 'zink-foundation' && needs.scope.outputs.zink_skip_linux_checks == 'true'
        run: cargo build -p trames-cli --release --locked
      - name: Check changed Vulkan backend and native graphics and synchronization
        if: needs.scope.outputs.native_scope == 'zink-sync' || needs.scope.outputs.native_scope == 'zink-gles'
        run: |
          cargo fmt --all --check
          cargo clippy -p trames-vulkan --all-targets --locked -- -D warnings
          cargo test -p trames-vulkan --lib --locked
          cargo build -p trames-cli --release --locked
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          cargo run -p trames-vulkan --example timeline --release --locked
          cargo run -p trames-vulkan --example renderpass --release --locked
          cargo run -p trames-vulkan --example resources --release --locked -- tests/fixtures/bin/vulkan-resources.spv
          cargo run -p trames-vulkan --example lifecycle --release --locked -- tests/fixtures/bin/vulkan-compute.spv tests/fixtures/bin/vulkan-render.vert.spv tests/fixtures/bin/vulkan-render.frag.spv
      - name: Validate query and template foundation and retain actual Mesa outcome
        run: |
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          export TRAMES_ZINK_CPU_REFERENCE=1
          if [[ '${{ needs.scope.outputs.native_scope }}' == zink-gles ]]; then
            python3 tests/integration/zink-foundation.py --require-render --snapshot-store target/zink-native-bundle/store
            python3 scripts/prepare-zink-native-bundle.py
          else
            python3 tests/integration/zink-foundation.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zink-foundation-evidence
          path: |
            target/zink-foundation/
            target/zink-inputs/inputs.json
            target/vulkan-guest/manifest.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && needs.scope.outputs.native_scope == 'zink-gles'
        with:
          name: zink-native-bundle
          path: target/zink-native-bundle/
          include-hidden-files: true
          retention-days: 3
  zink-gles-apple:
    needs: [scope, zink-foundation]
    if: needs.scope.outputs.native_scope == 'zink-gles'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          targets: aarch64-apple-ios
          components: clippy
      - uses: actions/download-artifact@v4
        with:
          name: zink-native-bundle
          path: target/zink-native-bundle
      - name: Verify exact guest inputs, Apple modules and iOS embedding
        run: |
          python3 scripts/prepare-zink-native-bundle.py --verify
          cargo clippy -p trames-vulkan --all-targets --locked -- -D warnings
          cargo test -p trames-vulkan --lib --locked
          cargo check -p trames-ffi --target aarch64-apple-ios --locked
      - name: Run original MoltenVK Metal resource and Mesa GLSL paths
        run: |
          mkdir -p target/zink-metal-native
          python3 scripts/prepare-vulkan.py --apple
          export TRAMES_MOLTENVK_STATIC_DIR="$PWD/target/vulkan-upstream/moltenvk-all/MoltenVK/MoltenVK/static/MoltenVK.xcframework/macos-arm64_x86_64"
          export MACOSX_DEPLOYMENT_TARGET=12.0
          export RUSTFLAGS="-C link-arg=-framework -C link-arg=IOKit -C link-arg=$(xcrun clang --print-runtime-dir)/libclang_rt.osx.a"
          cargo build -p trames-cli --release --locked
          cargo run -p trames-vulkan --example timeline --release --locked 2>&1 | tee target/zink-metal-native/timeline.log
          cargo run -p trames-vulkan --example renderpass --release --locked 2>&1 | tee target/zink-metal-native/renderpass.log
          cargo run -p trames-vulkan --example resources --release --locked -- target/zink-native-bundle/shaders/vulkan-resources.spv 2>&1 | tee target/zink-metal-native/resources.log
          export TRAMES_RUNNER="$PWD/target/release/trames-run"
          export TRAMES_VULKAN_TRACE=1
          python3 tests/integration/zink-foundation.py --store target/zink-native-bundle/store --probe-only --require-render --output target/zink-metal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zink-metal-evidence
          path: |
            target/zink-metal/
            target/zink-metal-native/
            target/zink-native-bundle/checksums.json
          retention-days: 14
  runtime-fastpaths:
    needs: scope
    if: needs.scope.outputs.native_scope == 'runtime-fastpaths'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Check affected VFS and scheduling paths
        run: |
          cargo fmt --all --check
          cargo clippy -p trames-vfs -p trames-core -p trames-ffi --all-targets --all-features --locked -- -D warnings
          cargo test -p trames-vfs -p trames-core --locked
          python3 -m py_compile tests/performance/prepare-coremark.py tests/performance/session-coremark.py
      - name: Validate production multiple-terminal control and cancellation
        run: |
          cargo build -p trames-ffi --release --locked
          mkdir -p target/alpine-download
          curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o target/alpine-download/alpine-minirootfs-3.22.6-aarch64.tar.gz
          python3 tests/integration/multiple-terminals.py
  release-core:
    needs: scope
    if: needs.scope.outputs.native_scope == 'release-core' || needs.scope.outputs.native_scope == 'release-cross'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
          targets: aarch64-apple-ios
      - name: Install LLVM archiver for the iOS cross target
        run: sudo apt-get update && sudo apt-get install --yes clang llvm
      - name: Check release workspace formatting, lints and all Rust tests
        if: needs.scope.outputs.native_scope != 'release-cross'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
      - name: Complete release iOS cross compile
        run: |
          cargo check -p trames-core -p trames-distro -p trames-ffi --target aarch64-apple-ios --locked
  docker-default-lifecycle:
    needs: scope
    if: needs.scope.outputs.native_scope == 'docker-default-lifecycle'
    strategy:
      fail-fast: false
      matrix:
        part: [exec, storage]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - name: Validate focused harness syntax and build unchanged release runtime
        run: |
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path('tests/integration/docker-default-lifecycle.py').read_text())
          PY
          bash -n tests/integration/docker-default-lifecycle.sh
          cargo build -p trames-cli --release --locked
      - name: Exercise original default Docker lifecycle
        env:
          TRAMES_ALPINE_CACHE: ${{ github.workspace }}/target/alpine-download
        run: |
          mkdir -p "$TRAMES_ALPINE_CACHE"
          curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_CACHE/alpine-minirootfs-3.22.6-aarch64.tar.gz"
          python3 tests/integration/docker-default-lifecycle.py '${{ matrix.part }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-docker-default-${{ matrix.part }}
          path: target/docker-default-${{ matrix.part }}/
          if-no-files-found: error
          retention-days: 14
  targeted-runtime:
    needs: scope
    if: needs.scope.outputs.targeted == 'true' && needs.scope.outputs.skip_native != 'true' && needs.scope.outputs.native_scope != 'release-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Check affected modules
        if: needs.scope.outputs.skip_modules != 'true'
        run: |
          cargo fmt --all --check
          if [[ '${{ needs.scope.outputs.docker_default_remount }}' == true ]]; then
            cargo clippy -p trames-vfs --all-targets --locked -- -D warnings
            cargo test -p trames-vfs --lib mounts:: --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == docker-default ]]; then
            cargo clippy -p trames-net -p trames-vfs -p trames-linux -p trames-core -p trames-ffi -p trames-cli --all-targets --locked -- -D warnings
            cargo test -p trames-net --locked
            cargo test -p trames-vfs --lib --locked
            cargo test -p trames-linux --lib network --locked
            cargo test -p trames-core --lib socket_timeout --locked
            cargo test -p trames-core --lib seccomp --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == wayland-input ]]; then
            cargo clippy -p trames-wayland --all-targets --locked -- -D warnings
            cargo test -p trames-wayland --lib nested_popup_unmap --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == wayland-clipboard ]]; then
            cargo clippy -p trames-wayland --all-targets --locked -- -D warnings
            cargo test -p trames-wayland --lib clipboard_permission --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == host-terminals ]]; then
            cargo clippy -p trames-vfs -p trames-core -p trames-ffi --all-targets --locked -- -D warnings
            cargo test -p trames-vfs -p trames-core -p trames-ffi --lib --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-storage ]]; then
            if [[ '${{ needs.scope.outputs.storage_proc_only }}' == true ]]; then
              cargo clippy -p trames-vfs --all-targets --locked -- -D warnings
              cargo test -p trames-vfs --lib proc --locked
            else
              cargo clippy -p trames-vfs -p trames-linux -p trames-core -p trames-ffi -p trames-cli --all-targets --locked -- -D warnings
              cargo test -p trames-vfs --lib --locked
              cargo test -p trames-linux --lib file_calls --locked
            fi
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-network && '${{ needs.scope.outputs.docker_network_retry }}' == true ]]; then
            if [[ '${{ needs.scope.outputs.docker_network_virtual_retry }}' == true ]]; then
              cargo test -p trames-net --test virtual native_gateway_tcp_and_udp_both_families --locked
            else
              cargo test -p trames-net --lib native_root_input --locked
              cargo test -p trames-linux --lib udp_pktinfo --locked
            fi
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-network && '${{ needs.scope.outputs.docker_network }}' == true ]]; then
            cargo clippy -p trames-net -p trames-vfs -p trames-linux -p trames-core -p trames-ffi -p trames-cli --all-targets --locked -- -D warnings
            cargo test -p trames-net --locked
            cargo test -p trames-vfs --lib network --locked
            cargo test -p trames-vfs --lib events --locked
            cargo test -p trames-linux --lib network --locked
            cargo test -p trames-linux --lib file_calls --locked
            cargo test -p trames-ffi --lib managed_dns --locked
            cargo test -p trames-core --lib splice --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-network && '${{ needs.scope.outputs.nftables }}' == true ]]; then
            cargo clippy -p trames-net --all-targets --locked -- -D warnings
            cargo test -p trames-net --lib --locked
            cargo test -p trames-net --test virtual --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-network && '${{ needs.scope.outputs.docker_bridge }}' == true ]]; then
            cargo clippy -p trames-net -p trames-vfs --all-targets --locked -- -D warnings
            cargo test -p trames-net --lib --locked
            cargo test -p trames-vfs --lib network --locked
            cargo test -p trames-net --test virtual --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-network && '${{ needs.scope.outputs.network_retry }}' == true ]]; then
            cargo clippy -p trames-net --all-targets --locked -- -D warnings
            cargo test -p trames-net --lib routing_tests --locked
            cargo test -p trames-net --test virtual namespace_finish_resets_peer_and_preserves_other_namespace --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-network ]]; then
            cargo clippy -p trames-net -p trames-vfs -p trames-linux --all-targets --locked -- -D warnings
            cargo test -p trames-net -p trames-vfs -p trames-linux --lib --locked
            cargo test -p trames-net --test virtual --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-isolation && '${{ needs.scope.outputs.isolation_retry }}' == true ]]; then
            cargo clippy -p trames-linux -p trames-core --all-targets --locked -- -D warnings
            cargo test -p trames-linux --lib socket_output_preflight_and_descriptor_type_errors --locked
            cargo test -p trames-core --lib seccomp --locked
          elif [[ '${{ needs.scope.outputs.native_scope }}' == container-isolation ]]; then
            cargo clippy -p trames-net -p trames-vfs -p trames-linux -p trames-core --all-targets --locked -- -D warnings
            cargo test -p trames-net -p trames-vfs -p trames-linux -p trames-core --lib --locked
            cargo test -p trames-net --test virtual --locked
            cargo test -p trames-cpu --lib disabled_authentication_and_ordering_hints_preserve_values --locked
          else
            cargo clippy -p trames-shared -p trames-wayland -p trames-vfs -p trames-ffi --all-targets --locked -- -D warnings
            cargo test -p trames-shared -p trames-wayland -p trames-vfs -p trames-ffi --lib --locked
          fi
      - name: Exercise original GTK3 and mousepad, including clipboard FD transfers
        if: needs.scope.outputs.skip_modules != 'true' && needs.scope.outputs.native_scope != 'host-terminals' && needs.scope.outputs.native_scope != 'container-isolation' && needs.scope.outputs.native_scope != 'container-network' && needs.scope.outputs.native_scope != 'container-storage' && needs.scope.outputs.native_scope != 'docker-default'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libgtk-3-0 mousepad fonts-dejavu-core
          if [[ '${{ needs.scope.outputs.native_scope }}' == wayland-input ]]; then
            cargo test -p trames-wayland --test gtk_client original_gtk_context_menu_copy_keeps_selection_and_keyboard_focus --locked -- --ignored --nocapture
          elif [[ '${{ needs.scope.outputs.native_scope }}' == wayland-clipboard ]]; then
            cargo test -p trames-wayland --test gtk_client host_paste_permission_wait --locked -- --ignored --nocapture
          else
            cargo test -p trames-wayland --test gtk_client --locked -- --ignored --nocapture
          fi
      - name: Exercise original signed ARM64 foot over the guest Wayland ABI
        if: needs.scope.outputs.native_scope != 'wayland-input' && needs.scope.outputs.native_scope != 'wayland-clipboard' && needs.scope.outputs.native_scope != 'host-terminals' && needs.scope.outputs.native_scope != 'container-isolation' && needs.scope.outputs.native_scope != 'container-network' && needs.scope.outputs.native_scope != 'container-storage' && needs.scope.outputs.native_scope != 'docker-default'
        timeout-minutes: 10
        env:
          TRAMES_FOOT_STORE: ${{ github.workspace }}/target/foot-acceptance/store
          TRAMES_FOOT_REPOSITORY: ${{ github.workspace }}/target/foot-acceptance/repository
          TRAMES_FOOT_ROOTFS: ${{ github.workspace }}/target/foot-acceptance/rootfs.tar.gz
          TRAMES_FFI_LIB: ${{ github.workspace }}/target/release/libtrames_ffi.so
          TRAMES_FOOT_LOG: ${{ github.workspace }}/target/foot-acceptance/foot.log
        run: |
          python3 - <<'PY'
          import importlib.util,pathlib,urllib.request
          root=pathlib.Path('target/foot-acceptance');root.mkdir(parents=True,exist_ok=True)
          spec=importlib.util.spec_from_file_location('m6','tests/integration/m6.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.CACHE=root/'download';m.CACHE.mkdir(exist_ok=True)
          m.repository(root/'repository',tools=('foot','font-dejavu'))
          urllib.request.urlretrieve('https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz',root/'rootfs.tar.gz')
          PY
          cargo build -p trames-ffi --release --locked
          python3 tests/integration/foot-wayland.py --prepare
      - name: Exercise multiple independent terminals in one original Alpine guest
        if: needs.scope.outputs.native_scope == 'host-terminals'
        env:
          TRAMES_ALPINE_ARCHIVE: ${{ github.workspace }}/target/multi-terminal-rootfs.tar.gz
        run: |
          mkdir -p target
          curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_ARCHIVE"
          cargo build -p trames-ffi --release --locked
          python3 tests/integration/multiple-terminals.py
      - name: Exercise original guest Docker overlay2 and persistent image layers
        if: needs.scope.outputs.native_scope == 'container-storage' && needs.scope.outputs.storage_proc_only != 'true'
        env:
          TRAMES_ALPINE_CACHE: ${{ github.workspace }}/target/alpine-download
        run: |
          cargo build -p trames-cli --release --locked
          mkdir -p "$TRAMES_ALPINE_CACHE"
          curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_CACHE/alpine-minirootfs-3.22.6-aarch64.tar.gz"
          python3 tests/integration/docker-overlay.py
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.native_scope == 'container-storage' && needs.scope.outputs.storage_proc_only != 'true'
        with:
          name: guest-docker-overlay
          path: target/docker-overlay/
          if-no-files-found: error
          retention-days: 14
      - name: Exercise original Docker defaults, managed containerd and runc
        if: needs.scope.outputs.native_scope == 'docker-default'
        env:
          TRAMES_ALPINE_CACHE: ${{ github.workspace }}/target/alpine-download
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          bash scripts/build-socket-timeouts-fixture.sh
          cargo build -p trames-cli --release --locked
          if [[ '${{ needs.scope.outputs.docker_default_remount }}' != true ]]; then
            tests/fixtures/bin/socket-timeouts-host
            tests/fixtures/bin/socket-timeouts-host seccomp
            for cpus in 1 4; do
              target/release/trames-run --cpus "$cpus" --memory --max-instructions 1000000000 --exec-file /socket-timeouts=tests/fixtures/bin/socket-timeouts --guest /socket-timeouts netlink
              target/release/trames-run --cpus "$cpus" --memory --max-instructions 1000000000 --exec-file /socket-timeouts=tests/fixtures/bin/socket-timeouts --guest /socket-timeouts seccomp
            done
            target/release/trames-run --cpus 4 --network loopback --memory --max-instructions 1000000000 --exec-file /socket-timeouts=tests/fixtures/bin/socket-timeouts --guest /socket-timeouts
          fi
          mkdir -p "$TRAMES_ALPINE_CACHE"
          curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_CACHE/alpine-minirootfs-3.22.6-aarch64.tar.gz"
          python3 tests/integration/docker-default.py
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.native_scope == 'docker-default'
        with:
          name: guest-docker-defaults
          path: target/docker-default-acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Exercise real guest container isolation and original Docker defaults
        if: needs.scope.outputs.native_scope == 'container-isolation'
        env:
          TRAMES_ALPINE_CACHE: ${{ github.workspace }}/target/alpine-download
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          bash scripts/build-container-isolation-fixtures.sh
          cargo build -p trames-cli --release --locked
          if [[ '${{ needs.scope.outputs.isolation_retry }}' == true ]]; then
            python3 tests/integration/container-isolation.py --seccomp-only
          else
            python3 tests/integration/container-isolation.py
            mkdir -p "$TRAMES_ALPINE_CACHE"
            curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_CACHE/alpine-minirootfs-3.22.6-aarch64.tar.gz"
            python3 tests/integration/docker.py --isolated --require-run --cpus 4
          fi
      - name: Exercise real guest veth and bridge networking and retain Docker isolation
        if: needs.scope.outputs.native_scope == 'container-network' && needs.scope.outputs.docker_network_retry != 'true'
        env:
          TRAMES_ALPINE_CACHE: ${{ github.workspace }}/target/alpine-download
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          if [[ '${{ needs.scope.outputs.docker_network }}' == true ]]; then
            bash scripts/build-netfilter-nat-fixture.sh
            bash scripts/build-nftables-fixture.sh
          elif [[ '${{ needs.scope.outputs.nftables }}' == true ]]; then
            bash scripts/build-nftables-fixture.sh
            bash scripts/build-container-network-fixture.sh
          elif [[ '${{ needs.scope.outputs.docker_bridge }}' == true ]]; then
            bash scripts/build-docker-network-fixture.sh
          else
            bash scripts/build-container-network-fixture.sh
          fi
          cargo build -p trames-cli --release --locked
          if [[ '${{ needs.scope.outputs.docker_network }}' == true ]]; then
            mkdir -p "$TRAMES_ALPINE_CACHE"
            curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_CACHE/alpine-minirootfs-3.22.6-aarch64.tar.gz"
            python3 tests/integration/nftables.py
            python3 tests/integration/netfilter-nat.py
            python3 tests/integration/docker-network.py --cpus 4
          elif [[ '${{ needs.scope.outputs.nftables }}' == true ]]; then
            python3 tests/integration/container-network.py --forwarding-only
            mkdir -p "$TRAMES_ALPINE_CACHE"
            curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_CACHE/alpine-minirootfs-3.22.6-aarch64.tar.gz"
            python3 tests/integration/nftables.py
          elif [[ '${{ needs.scope.outputs.docker_bridge }}' == true ]]; then
            python3 tests/integration/container-network.py --docker-control-only
          else
            python3 tests/integration/container-network.py
          fi
          if [[ '${{ needs.scope.outputs.network_retry }}' != true && '${{ needs.scope.outputs.nftables }}' != true && '${{ needs.scope.outputs.docker_network }}' != true ]]; then
            mkdir -p "$TRAMES_ALPINE_CACHE"
            curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o "$TRAMES_ALPINE_CACHE/alpine-minirootfs-3.22.6-aarch64.tar.gz"
            if [[ '${{ needs.scope.outputs.docker_bridge }}' == true ]]; then
              python3 tests/integration/docker.py --internal-bridge --require-run --cpus 4
            else
              python3 tests/integration/docker.py --isolated --require-run --cpus 4
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.native_scope == 'container-network' && needs.scope.outputs.docker_network_retry != 'true'
        with:
          name: guest-container-network
          path: |
            target/container-network/
            target/docker-lifecycle/
            target/docker-network-control/
            target/docker-bridge-lifecycle/
            target/nftables/
            target/container-forwarding/
            target/netfilter-nat/
            target/docker-full-network/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.native_scope == 'container-isolation'
        with:
          name: original-docker-isolation
          path: |
            target/container-isolation/
            target/docker-lifecycle/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-arm64-foot-log
          path: target/foot-acceptance/foot.log
          if-no-files-found: ignore
          retention-days: 7
  runtime:
    needs: scope
    if: needs.scope.outputs.frontend_only != 'true' && needs.scope.outputs.targeted != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64 -cpu max
      TRAMES_RUNNER: ${{ github.workspace }}/tests/differential/arm-runner.sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy, rust-src
          targets: aarch64-apple-ios,aarch64-unknown-linux-musl
      - name: Install independent AArch64 oracle and cross assembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu qemu-user build-essential curl bzip2 openssl ninja-build pkg-config clang llvm libglib2.0-dev python3-venv ripgrep
      - uses: actions/cache@v4
        with:
          path: target/qemu-oracle
          key: qemu-10.0.13-aarch64-user-ubuntu24.04-4a59b74d-v1
      - name: Build pinned independent QEMU oracle
        run: |
          bash scripts/build-qemu-oracle.sh
          echo "$GITHUB_WORKSPACE/target/qemu-oracle/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - name: Check region guard races with fully instrumented Rust standard library
        env:
          RUSTFLAGS: -Zsanitizer=thread
          CARGO_TARGET_DIR: target/thread-sanitizer
        run: cargo test -Zbuild-std -p trames-memory -p trames-accel --target x86_64-unknown-linux-gnu --locked --lib --tests
      - name: Check original-source native allocator C with address and undefined behavior sanitizers
        run: bash scripts/check-native-allocator.sh
      - name: Compile core and both network backends for iOS (no SDK link or device test)
        run: cargo check -p trames-core -p trames-distro -p trames-ffi --target aarch64-apple-ios --locked
      - name: Execute ARM64 compute, memory and native worker tests under the independent oracle
        run: |
          cargo test -p trames-compute -p trames-native -p trames-cpu -p trames-memory -p trames-accel -p trames-vfs -p trames-core --target aarch64-unknown-linux-musl --locked
          cargo build -p trames-cli --target aarch64-unknown-linux-musl --release --locked
      - run: python3 tests/differential/run.py
      - run: python3 tests/differential/m1.py
      - run: python3 tests/differential/lazy_flags.py
      - run: python3 tests/differential/integer_blocks.py
      - run: python3 tests/differential/fixed_slots.py
      - run: python3 tests/differential/floating.py
      - run: python3 tests/differential/vector_floating.py
      - run: python3 tests/differential/structures.py
      - run: python3 tests/differential/pairwise_integer.py
      - run: python3 tests/differential/widening_integer.py
      - run: python3 tests/differential/vector_copy_shift.py
      - run: python3 tests/differential/vector_integer.py
      - run: python3 tests/differential/atomics_crc.py
      - run: python3 tests/differential/half_floating.py
      - run: python3 tests/differential/crypto.py
      - run: python3 tests/differential/modern.py
      - run: python3 tests/differential/frint_rcpc.py
      - run: python3 tests/differential/coverage_extensions.py
      - name: Cross-build pinned musl and static BusyBox
        run: |
          if ! bash scripts/build-busybox.sh > target/busybox-build.log 2>&1; then
            tail -100 target/busybox-build.log
            exit 1
          fi
          tail -10 target/busybox-build.log
      - name: Compare actual musl CPU fault handlers and context recovery
        run: |
          bash scripts/build-cpu-fixtures.sh
          python3 tests/integration/cpu-signals.py
      - run: bash scripts/build-compatibility-log-fixtures.sh
      - run: python3 tests/integration/compatibility-log.py
      - name: Compare altstack, memory barriers and process file limits
        run: |
          bash scripts/build-runtime-compat-fixtures.sh
          python3 tests/integration/runtime-compat.py
      - name: Compare inode notifications, epoll edges and fork with Linux
        run: |
          bash scripts/build-inotify-fixtures.sh
          python3 tests/integration/inotify.py
      - run: bash scripts/build-mmap-fixtures.sh
      - run: python3 tests/integration/mmap.py
      - name: Validate configurable guest memory across threads, fork and exec
        run: |
          bash scripts/build-memory-budget-fixtures.sh
          python3 tests/integration/memory-budget.py
      - run: python3 tests/integration/busybox.py
      - run: bash scripts/build-m2-fixtures.sh
      - run: python3 tests/integration/m2.py
      - run: python3 tests/integration/terminal.py
      - run: bash scripts/build-storage-fixtures.sh
      - run: python3 tests/integration/storage.py
      - run: bash scripts/build-network-fixtures.sh
      - run: bash scripts/build-virtual-network-fixtures.sh
      - run: bash scripts/build-linux-compat-fixtures.sh
      - name: Compare native loopback sockets and real musl DNS with QEMU
        # The deterministic DNS peer binds host loopback port 53. The guest's
        # port restriction still applies even when this test harness is root.
        run: sudo env PATH="$PATH" python3 tests/integration/network.py
      - run: python3 tests/integration/m2.py
        env:
          TRAMES_TEST_STORAGE: disk
      - run: python3 tests/integration/terminal.py
        env:
          TRAMES_TEST_STORAGE: disk
      - name: Prepare pinned Alpine and dynamic fixtures
        run: bash scripts/prepare-alpine.sh
      - run: cargo build --release --workspace --all-features --locked
      - name: Build complete hybrid musl from pinned original source
        run: bash scripts/build-musl-hybrid.sh > /tmp/musl-build.log 2>&1 || { tail -30 /tmp/musl-build.log; exit 1; }
      - name: Compare full musl loader, startup, TLS, threads and pure functions
        run: |
          bash scripts/build-musl-hybrid-fixtures.sh
          python3 tests/integration/musl-hybrid.py
          python3 tests/integration/numeric.py
          python3 tests/integration/stdlib.py
          python3 tests/integration/allocator.py | tee target/allocator-workflow.log
          python3 tests/integration/native-parallel.py | tee target/native-parallel-workflow.log
          python3 tests/integration/region-memory.py | tee target/region-memory-workflow.log
      - name: Build and compare opt-in NativeCall guest ELF stubs on ARM64
        run: |
          bash scripts/build-accelerator-fixtures.sh
          python3 tests/integration/accelerator.py
      - uses: actions/upload-artifact@v4
        with:
          name: accelerator-guest-library-and-source
          path: target/accelerator-guest/libtrames-pure-v1.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Validate dynamic Alpine, HTTPS trust and signed apk installation
        run: python3 tests/integration/m3.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Validate virtual packet fabric, guest ABI and Alpine HTTPS gateway
        run: python3 tests/integration/virtual-network.py
      - name: Validate Linux endpoints, musl threads, ICMP and real Vim editing
        # Allow unprivileged ICMP datagram sockets on this disposable runner.
        # The guest still has no host raw socket or host sysctl interface.
        run: |
          sudo sysctl -w net.ipv4.ping_group_range='0 2147483647'
          python3 tests/integration/linux-compat.py
        env:
          TRAMES_REQUIRE_ICMP_EGRESS: '1'
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so

      - name: Exercise the embedding ABI with real Alpine PTY and disk streams
        run: |
          cargo build -p trames-ffi --release --locked
          TRAMES_TEST_MUSL="$GITHUB_WORKSPACE/target/musl-hybrid/libc.so" python3 tests/integration/embedding.py

      - name: Compare guest-created PTYs, hangups and sudo IPC with Linux and QEMU
        run: |
          bash scripts/build-pty-fixtures.sh
          python3 tests/integration/guest-pty.py
      - name: Validate signed sudo escalation, passwords, nested PTYs and interactive relay
        run: python3 tests/integration/sudo.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Validate host timezone rules, guest date and Python daylight saving time
        run: python3 tests/integration/timezone.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Compare inode-based execve and execveat with native Linux
        run: |
          bash scripts/build-fd-exec-fixtures.sh
          python3 tests/integration/fd-exec.py
      - name: Validate guest UTS/mount/PID namespaces, init lifecycle and direct listeners
        run: |
          bash scripts/build-namespace-fixtures.sh
          python3 tests/integration/namespaces.py
          python3 tests/integration/direct-network.py
          python3 tests/integration/embedding-network.py
        env:
          TRAMES_REQUIRE_ICMP_EGRESS: '1'
      - name: Compare standard guest Vulkan compute and rasterization with the native software driver
        run: |
          sudo apt-get install --yes libvulkan-dev mesa-vulkan-drivers glslang-tools
          bash scripts/build-vulkan-fixtures.sh
          python3 tests/integration/embedding-reopen.py
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          python3 tests/integration/vulkan-compute.py
          python3 tests/integration/vulkan-render.py
          python3 tests/integration/vulkan-texture.py
          cargo run --release --locked -p trames-vulkan --example lifecycle -- tests/fixtures/bin/vulkan-compute.spv tests/fixtures/bin/vulkan-render.vert.spv tests/fixtures/bin/vulkan-render.frag.spv
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-render-pixels
          path: |
            target/vulkan-render/*.ppm
            target/vulkan-texture/*.ppm
          retention-days: 7
      - name: Validate signed Python anonymous ELF, pass_fds and libc fexecve
        run: python3 tests/integration/memfd-python.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so

      - name: Signed Python install, repair and execution with 128 host descriptors
        run: python3 tests/integration/python.py
        # Large package/tool workflows use the development-host executor;
        # strict instruction/libm comparisons above execute ARM64 compute.
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Validate guest capability enforcement and original signed libcap tools
        run: |
          bash scripts/build-capability-fixtures.sh
          python3 tests/integration/capabilities.py
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
      - name: Compare signalfd and shared signal queues with native Linux
        run: |
          bash scripts/build-signalfd-fixtures.sh
          python3 tests/integration/signalfd.py
      - name: Compare Unix IPC, pipe metadata, parent death signals and OOM preferences
        run: |
          bash scripts/build-unix-fixtures.sh
          python3 tests/integration/unix-sockets.py
      - name: Validate guest cgroups and device BPF; compare dumpable with native Linux
        run: |
          bash scripts/build-cgroup-fixtures.sh
          python3 tests/integration/cgroups.py
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
      - name: Validate device inodes and scoped openat2 against native Linux
        run: |
          bash scripts/build-device-fixtures.sh
          python3 tests/integration/devices.py
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
      - name: Validate original signed guest crun container lifecycle
        run: python3 tests/integration/containers.py
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
      - name: Validate original Docker container payload, exit status, logs and cleanup
        run: python3 tests/integration/docker.py --require-run
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-docker-diagnostics
          path: target/docker-lifecycle/
          retention-days: 7
      - name: Compare M6 events, local IPC, POSIX locks and FIFO semantics with QEMU
        run: |
          bash scripts/build-m6-fixtures.sh
          python3 tests/integration/m6-abi.py
      - name: Compare ARM64 pthread, multicore atomics, memory barriers and shared futexes
        run: |
          set -o pipefail
          bash scripts/build-smp-fixtures.sh
          python3 tests/integration/smp.py | tee target/smp-workflow.log
      - name: Signed Node.js, default V8, libuv workers, HTTP and offline npm
        run: python3 tests/integration/nodejs.py | tee target/nodejs-tools.log
        env:
          TRAMES_CPUS: 4
          TRAMES_NATIVE_ALLOCATOR: 1
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Signed developer tools and complete guest workflows on a fresh persistent store
        run: python3 tests/integration/m6.py | tee target/m6-tools.log
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: |
            target/container-lifecycle/
            target/m6-tools.log
            target/m6-workflow.log
            target/nodejs-tools.log
            target/nodejs-workflow.log
            target/smp-workflow.log
            target/native-parallel-workflow.log
            target/region-memory-workflow.log
            target/allocator-workflow.log
            target/musl-hybrid/allocator-validation.json
            target/musl-hybrid/native-parallel-validation.json
          if-no-files-found: error
