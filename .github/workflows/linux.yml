name: Linux runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install independent AArch64 oracle and cross assembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu qemu-user build-essential curl bzip2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: python3 tests/differential/run.py
      - run: python3 tests/differential/m1.py
      - run: python3 tests/differential/floating.py
      - run: python3 tests/differential/vector_floating.py
      - run: python3 tests/differential/structures.py
      - name: Cross-build pinned musl and static BusyBox
        run: |
          if ! bash scripts/build-busybox.sh > target/busybox-build.log 2>&1; then
            tail -100 target/busybox-build.log
            exit 1
          fi
          tail -10 target/busybox-build.log
      - run: python3 tests/integration/busybox.py
      - run: bash scripts/build-m2-fixtures.sh
      - run: python3 tests/integration/m2.py
      - run: python3 tests/integration/terminal.py
