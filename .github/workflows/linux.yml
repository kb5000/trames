name: Linux M0
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install independent AArch64 oracle and cross assembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu qemu-user
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: python3 tests/differential/run.py
