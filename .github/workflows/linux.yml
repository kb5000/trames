name: Linux runtime
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64 -cpu max
      TRAMES_RUNNER: ${{ github.workspace }}/tests/differential/arm-runner.sh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy, rust-src
          targets: aarch64-apple-ios,aarch64-unknown-linux-musl
      - name: Install independent AArch64 oracle and cross assembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu qemu-user build-essential curl bzip2 openssl ninja-build pkg-config clang llvm libglib2.0-dev python3-venv ripgrep
      - uses: actions/cache@v4
        with:
          path: target/qemu-oracle
          key: qemu-10.0.13-aarch64-user-ubuntu24.04-4a59b74d-v1
      - name: Build pinned independent QEMU oracle
        run: |
          bash scripts/build-qemu-oracle.sh
          echo "$GITHUB_WORKSPACE/target/qemu-oracle/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - name: Check region guard races with fully instrumented Rust standard library
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: -Zsanitizer=thread
          CARGO_TARGET_DIR: target/thread-sanitizer
        run: cargo test -Zbuild-std -p trames-memory -p trames-accel --target x86_64-unknown-linux-gnu --locked --lib
      - name: Check original-source native allocator C with address and undefined behavior sanitizers
        run: bash scripts/check-native-allocator.sh
      - name: Compile core and both network backends for iOS (no SDK link or device test)
        run: cargo check -p trames-core -p trames-distro -p trames-ffi --target aarch64-apple-ios --locked
      - name: Execute ARM64 compute, memory and native worker tests under the independent oracle
        run: |
          cargo test -p trames-compute -p trames-native -p trames-cpu -p trames-memory -p trames-accel -p trames-vfs -p trames-core --target aarch64-unknown-linux-musl --locked
          cargo build -p trames-cli --target aarch64-unknown-linux-musl --release --locked
      - run: python3 tests/differential/run.py
      - run: python3 tests/differential/m1.py
      - run: python3 tests/differential/floating.py
      - run: python3 tests/differential/vector_floating.py
      - run: python3 tests/differential/structures.py
      - run: python3 tests/differential/pairwise_integer.py
      - run: python3 tests/differential/widening_integer.py
      - run: python3 tests/differential/vector_copy_shift.py
      - run: python3 tests/differential/vector_integer.py
      - run: python3 tests/differential/atomics_crc.py
      - run: python3 tests/differential/half_floating.py
      - run: python3 tests/differential/crypto.py
      - run: python3 tests/differential/modern.py
      - run: python3 tests/differential/frint_rcpc.py
      - run: python3 tests/differential/coverage_extensions.py
      - name: Cross-build pinned musl and static BusyBox
        run: |
          if ! bash scripts/build-busybox.sh > target/busybox-build.log 2>&1; then
            tail -100 target/busybox-build.log
            exit 1
          fi
          tail -10 target/busybox-build.log
      - name: Compare actual musl CPU fault handlers and context recovery
        run: |
          bash scripts/build-cpu-fixtures.sh
          python3 tests/integration/cpu-signals.py
      - run: bash scripts/build-compatibility-log-fixtures.sh
      - run: python3 tests/integration/compatibility-log.py
      - name: Compare altstack, memory barriers and process file limits
        run: |
          bash scripts/build-runtime-compat-fixtures.sh
          python3 tests/integration/runtime-compat.py
      - run: bash scripts/build-mmap-fixtures.sh
      - run: python3 tests/integration/mmap.py
      - run: python3 tests/integration/busybox.py
      - run: bash scripts/build-m2-fixtures.sh
      - run: python3 tests/integration/m2.py
      - run: python3 tests/integration/terminal.py
      - run: bash scripts/build-storage-fixtures.sh
      - run: python3 tests/integration/storage.py
      - run: bash scripts/build-network-fixtures.sh
      - run: bash scripts/build-virtual-network-fixtures.sh
      - run: bash scripts/build-linux-compat-fixtures.sh
      - name: Compare native loopback sockets and real musl DNS with QEMU
        # The deterministic DNS peer binds host loopback port 53. The guest's
        # port restriction still applies even when this test harness is root.
        run: sudo env PATH="$PATH" python3 tests/integration/network.py
      - run: python3 tests/integration/m2.py
        env:
          TRAMES_TEST_STORAGE: disk
      - run: python3 tests/integration/terminal.py
        env:
          TRAMES_TEST_STORAGE: disk
      - name: Prepare pinned Alpine and dynamic fixtures
        run: bash scripts/prepare-alpine.sh
      - run: cargo build --release --workspace --all-features --locked
      - name: Build complete hybrid musl from pinned original source
        run: bash scripts/build-musl-hybrid.sh > /tmp/musl-build.log 2>&1 || { tail -30 /tmp/musl-build.log; exit 1; }
      - name: Compare full musl loader, startup, TLS, threads and pure functions
        run: |
          bash scripts/build-musl-hybrid-fixtures.sh
          python3 tests/integration/musl-hybrid.py
          python3 tests/integration/numeric.py
          python3 tests/integration/stdlib.py
          python3 tests/integration/allocator.py | tee target/allocator-workflow.log
          python3 tests/integration/native-parallel.py | tee target/native-parallel-workflow.log
          python3 tests/integration/region-memory.py | tee target/region-memory-workflow.log
      - name: Build and compare opt-in NativeCall guest ELF stubs on ARM64
        run: |
          bash scripts/build-accelerator-fixtures.sh
          python3 tests/integration/accelerator.py
      - uses: actions/upload-artifact@v4
        with:
          name: accelerator-guest-library-and-source
          path: target/accelerator-guest/libtrames-pure-v1.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Validate dynamic Alpine, HTTPS trust and signed apk installation
        run: python3 tests/integration/m3.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Validate virtual packet fabric, guest ABI and Alpine HTTPS gateway
        run: python3 tests/integration/virtual-network.py
      - name: Validate Linux endpoints, musl threads, ICMP and real Vim editing
        # Allow unprivileged ICMP datagram sockets on this disposable runner.
        # The guest still has no host raw socket or host sysctl interface.
        run: |
          sudo sysctl -w net.ipv4.ping_group_range='0 2147483647'
          python3 tests/integration/linux-compat.py
        env:
          TRAMES_REQUIRE_ICMP_EGRESS: '1'
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so

      - name: Exercise the embedding ABI with real Alpine PTY and disk streams
        run: |
          cargo build -p trames-ffi --release --locked
          TRAMES_TEST_MUSL="$GITHUB_WORKSPACE/target/musl-hybrid/libc.so" python3 tests/integration/embedding.py

      - name: Compare guest-created PTYs, hangups and sudo IPC with Linux and QEMU
        run: |
          bash scripts/build-pty-fixtures.sh
          python3 tests/integration/guest-pty.py
      - name: Validate signed sudo escalation, passwords, nested PTYs and interactive relay
        run: python3 tests/integration/sudo.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Validate host timezone rules, guest date and Python daylight saving time
        run: python3 tests/integration/timezone.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Compare inode-based execve and execveat with native Linux
        run: |
          bash scripts/build-fd-exec-fixtures.sh
          python3 tests/integration/fd-exec.py
      - name: Compare standard guest Vulkan compute and rasterization with the native software driver
        run: |
          sudo apt-get install --yes libvulkan-dev mesa-vulkan-drivers glslang-tools
          bash scripts/build-vulkan-fixtures.sh
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          python3 tests/integration/vulkan-compute.py
          python3 tests/integration/vulkan-render.py
          python3 tests/integration/vulkan-texture.py
          cargo run --release --locked -p trames-vulkan --example lifecycle -- tests/fixtures/bin/vulkan-compute.spv tests/fixtures/bin/vulkan-render.vert.spv tests/fixtures/bin/vulkan-render.frag.spv
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-render-pixels
          path: |
            target/vulkan-render/*.ppm
            target/vulkan-texture/*.ppm
          retention-days: 7
      - name: Validate signed Python anonymous ELF, pass_fds and libc fexecve
        run: python3 tests/integration/memfd-python.py
        env:
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so

      - name: Signed Python install, repair and execution with 128 host descriptors
        run: python3 tests/integration/python.py
        # Large package/tool workflows use the development-host executor;
        # strict instruction/libm comparisons above execute ARM64 compute.
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Compare M6 events, local IPC, POSIX locks and FIFO semantics with QEMU
        run: |
          bash scripts/build-m6-fixtures.sh
          python3 tests/integration/m6-abi.py
      - name: Compare ARM64 pthread, multicore atomics, memory barriers and shared futexes
        run: |
          set -o pipefail
          bash scripts/build-smp-fixtures.sh
          python3 tests/integration/smp.py | tee target/smp-workflow.log
      - name: Signed Node.js, default V8, libuv workers, HTTP and offline npm
        run: python3 tests/integration/nodejs.py | tee target/nodejs-tools.log
        env:
          TRAMES_CPUS: 4
          TRAMES_NATIVE_ALLOCATOR: 1
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - name: Signed developer tools and complete guest workflows on a fresh persistent store
        run: python3 tests/integration/m6.py | tee target/m6-tools.log
        env:
          TRAMES_RUNNER: ${{ github.workspace }}/target/release/trames-run
          TRAMES_TEST_MUSL: ${{ github.workspace }}/target/musl-hybrid/libc.so
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: |
            target/m6-tools.log
            target/m6-workflow.log
            target/nodejs-tools.log
            target/nodejs-workflow.log
            target/smp-workflow.log
            target/native-parallel-workflow.log
            target/region-memory-workflow.log
            target/allocator-workflow.log
            target/musl-hybrid/allocator-validation.json
            target/musl-hybrid/native-parallel-validation.json
          if-no-files-found: error
