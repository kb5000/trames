name: Runtime stabilization
on:
  push:
    branches: ['fix/stable-release-*']
    paths: ['crates/trames-core/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stabilization-${{ github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  linux-arm-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - name: Check the ARM worker regression cases on native Linux ARM64
        run: |
          result=0
          for case in allowed_filtered_identity_calls_continue_on_workers shared_futex_alias_requeue cohort_wait_wake_and_yield byte_resource_and_epoll_handoff epoll_timeout_reuses_pending ready_peer_preempts; do
            cargo test -p trames-core --lib --locked "$case" -- --nocapture || result=1
          done
          exit "$result"
  linux-arm-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64 -cpu max
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          targets: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu qemu-user
      - name: Reproduce ARM oracle failures without rerunning unrelated acceptance
        run: |
          qemu-aarch64 --version
          result=0
          for case in allowed_filtered_identity_calls_continue_on_workers shared_futex_alias_requeue cohort_wait_wake_and_yield byte_resource_and_epoll_handoff epoll_timeout_reuses_pending ready_peer_preempts; do
            cargo test -p trames-core --lib --target aarch64-unknown-linux-musl --locked "$case" -- --nocapture || result=1
          done
          exit "$result"
