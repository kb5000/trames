name: Xwayland GPU save dialog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xwayland-dialog.yml'
      - 'tests/integration/xwayland-dialog*.py'
      - 'accelerator/vulkan/graphics.inc'
      - 'crates/trames-vulkan/src/backend/graphics.rs'
      - 'patches/moltenvk/0005-native-transparent-black-border.patch'
      - 'patches/moltenvk/0006-pack-compatible-raster-varying-components.patch'
      - 'tests/fixtures/vulkan-components-*'
      - 'scripts/build-moltenvk.py'
      - 'tests/fixtures/vulkan-texture.c'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: xwayland-dialog-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Build only current Vulkan bridge and embedding
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu libvulkan-dev mesa-vulkan-drivers glslang-tools
          if python3 -c 'import json; assert json.load(open(".github/ios-validation-plan.json")).get("dialog_runtime_reuse")'; then
            python3 - <<'PYCODE'
          import json,os,subprocess,urllib.request
          p=json.load(open('.github/ios-validation-plan.json'))['dialog_runtime_reuse']
          subprocess.run(['git','fetch','--depth=1','origin',p['sha']],check=True)
          subprocess.run(['git','diff','--exit-code',p['sha'],'HEAD','--','crates','accelerator','Cargo.toml','Cargo.lock','vendor','.cargo','rust-toolchain.toml'],check=True)
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req) as response:return json.load(response)
          run=get('actions/runs/'+str(p['run']))
          assert run['head_sha']==p['sha'] and run['path']=='.github/workflows/xwayland-dialog.yml'
          job=next(j for j in get('actions/runs/'+str(p['run'])+'/jobs')['jobs'] if j['name']=='linux')
          assert any(x['name']=='Build only current Vulkan bridge and embedding' and x['conclusion']=='success' for x in job['steps'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('run='+str(p['run'])+'\n')
          print('Reuse identical-source host binaries and their passed Vulkan31/Clippy checks; run only affected integration validation.')
          previous=get('actions/runs/39663224481')
          assert previous['head_sha']=='6d7d26c0921b233d0a765d37d0a74c28f6925f11'
          jobs=get('actions/runs/39663224481/jobs')['jobs']
          assert any(j['name']=='linux' and j['conclusion']=='success' for j in jobs)
          assert any(j['name']=='metal' and any(x['name']=='Verify identical guest inputs and install without rebuilding guest packages' and x['conclusion']=='success' for x in j['steps']) for j in jobs)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('fixture_run=39663224481\n')
          PYCODE
          else
            cargo fmt --all --check
            cargo clippy -p trames-vulkan --all-targets --no-deps --locked -- -D warnings
            cargo test -p trames-vulkan --release --lib --locked
            cargo build -p trames-cli -p trames-ffi --release --locked
          fi
      - uses: actions/download-artifact@v4
        if: steps.runtime.outputs.run
        with:
          name: dialog-linux-runtime
          path: target/release
          github-token: ${{ github.token }}
          run-id: ${{ steps.runtime.outputs.run }}
      - name: Restore executable permission for verified runtime
        if: steps.runtime.outputs.run
        run: chmod 755 target/release/trames-run
      - uses: actions/upload-artifact@v4
        with:
          name: dialog-linux-runtime
          path: |
            target/release/trames-run
            target/release/libtrames_ffi.so
          retention-days: 7
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-compute-driver-and-native-source
          path: target/vulkan-guest
          github-token: ${{ github.token }}
          run-id: 39645800791
      - uses: actions/download-artifact@v4
        with:
          name: full-musl-library-and-source
          path: target/musl-hybrid
          github-token: ${{ github.token }}
          run-id: 39015795319
      - uses: actions/download-artifact@v4
        if: steps.runtime.outputs.fixture_run
        with:
          name: xwayland-dialog-inputs
          path: target/xwayland-dialog-inputs
          github-token: ${{ github.token }}
          run-id: ${{ steps.runtime.outputs.fixture_run }}
      - name: Prepare only original signed mousepad dependencies and rebuilt ICD
        if: steps.runtime.outputs.fixture_run == ''
        run: python3 tests/integration/xwayland-dialog-prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: xwayland-dialog-inputs
          path: target/xwayland-dialog-inputs/inputs.tar.gz
          retention-days: 7
      - name: Reproduce only unsaved-close dialogs on original glamor and Mesa
        if: steps.runtime.outputs.fixture_run == ''
        run: |
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          export TRAMES_ZINK_CPU_REFERENCE=1 LP_NUM_THREADS=2 TRAMES_VULKAN_TRACE=1
          python3 tests/integration/xwayland-dialog.py --native-wsi --ffi target/release/libtrames_ffi.so --store target/xwayland-dialog-inputs/store --output target/dialog-linux --layout-client target/xwayland-dialog-inputs/bin/vulkan-layouts 2>&1 | tee target/dialog-linux.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xwayland-dialog-linux
          path: |
            target/dialog-linux/
            target/dialog-linux.log
            target/xwayland-dialog-inputs/install.stdout
            target/xwayland-dialog-inputs/install.stderr
          retention-days: 7
      - name: Compile and verify only new packed/split component pixels
        run: |
          mkdir -p target/component-shaders
          for shader in tests/fixtures/vulkan-components-*; do
            glslangValidator -V --target-env vulkan1.0 "$shader" -o "target/component-shaders/$(basename "$shader").spv"
          done
          glslangValidator --version > target/component-shaders/toolchain.txt
          tar -xzf target/xwayland-dialog-inputs/inputs.tar.gz -C target/xwayland-dialog-inputs
          cp -a target/xwayland-dialog-inputs/guest/. target/vulkan-guest/
          cp -a target/xwayland-dialog-inputs/musl/. target/musl-hybrid/
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          export LP_NUM_THREADS=2
          python3 tests/integration/xwayland-dialog.py --native-wsi --ffi target/release/libtrames_ffi.so --store target/xwayland-dialog-inputs/store --output target/components-linux --component-client target/xwayland-dialog-inputs/bin/vulkan-layouts --component-shaders target/component-shaders --component-only 2>&1 | tee target/components-linux.log
      - uses: actions/upload-artifact@v4
        with:
          name: component-shaders
          path: target/component-shaders/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-pixels-linux
          path: |
            target/components-linux/
            target/components-linux.log
          retention-days: 7
  metal:
    needs: linux
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          targets: aarch64-apple-ios
      - uses: actions/download-artifact@v4
        with:
          name: xwayland-dialog-inputs
          path: target/dialog-download
      - name: Verify identical guest inputs and install without rebuilding guest packages
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/xwayland-dialog-inputs
          tar -xzf target/dialog-download/inputs.tar.gz -C target/xwayland-dialog-inputs
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,urllib.request
          from pathlib import Path
          root=Path('target/xwayland-dialog-inputs');m=json.loads((root/'inputs.json').read_text())
          subprocess.run(['git','fetch','--depth=1','origin',m['source']],check=True)
          subprocess.run(['git','diff','--exit-code',m['source'],'HEAD','--','crates','accelerator','tests/fixtures/zink-metal-pixels.m','tests/fixtures/vulkan-render.c','Cargo.toml','Cargo.lock','vendor','.cargo','rust-toolchain.toml'],check=True)
          assert m['source']=='6d7d26c0921b233d0a765d37d0a74c28f6925f11'
          print('Reuse unchanged exact-source Vulkan31, iOS FFI, four layout pixel modes and passed Linux dialogs; retry only failed Metal modal path.')
          for name,digest in m['sha256'].items():
              p=Path(name);assert not p.is_absolute() and '..' not in p.parts
              assert hashlib.sha256((root/p).read_bytes()).hexdigest()==digest,name
          shutil.copytree(root/'guest','target/vulkan-guest',dirs_exist_ok=True)
          shutil.copytree(root/'musl','target/musl-hybrid',dirs_exist_ok=True)
          source='50cd7575c53c89bbd221957b7ecf99092f62966f';run=39670229714
          subprocess.run(['git','fetch','--depth=1','origin',source],check=True)
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--','crates','accelerator','tests/fixtures/zink-metal-pixels.m','Cargo.toml','Cargo.lock','vendor','.cargo','rust-toolchain.toml'],check=True)
          same_native=subprocess.run(['git','diff','--quiet',source,'HEAD','--','scripts/build-moltenvk.py','patches/moltenvk','scripts/vulkan-upstream.json']).returncode==0
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req) as response:return json.load(response)
          assert get('actions/runs/'+str(run))['head_sha']==source
          job=next(j for j in get('actions/runs/'+str(run)+'/jobs')['jobs'] if j['name']=='metal')
          assert any(x['name']=='Run the same original mousepad dialog on native Metal' and x['conclusion']=='success' for x in job['steps'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('old_runtime='+str(run)+'\n')
              if same_native:output.write('native_runtime='+str(run)+'\n')
          print('Reuse exact-source compiled Metal runtime; only failed-path diagnostic variables change.')
          PY
      - uses: actions/download-artifact@v4
        if: steps.verify.outputs.native_runtime
        with:
          name: dialog-metal-runtime
          path: target
          github-token: ${{ github.token }}
          run-id: ${{ steps.verify.outputs.native_runtime }}
      - uses: actions/download-artifact@v4
        with:
          name: component-shaders
          path: target/component-shaders
      - uses: actions/download-artifact@v4
        if: steps.verify.outputs.native_runtime == ''
        with:
          name: dialog-metal-runtime
          path: target/component-reference
          github-token: ${{ github.token }}
          run-id: ${{ steps.verify.outputs.old_runtime }}
      - name: Require the original native driver to fail the new component pixel gate
        if: steps.verify.outputs.native_runtime == ''
        run: |
          if python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:],timeout=70).returncode)' python3 tests/integration/xwayland-dialog.py --native-wsi --ffi target/component-reference/release/libtrames_ffi.dylib --store target/xwayland-dialog-inputs/store --output target/components-metal-before --component-client target/xwayland-dialog-inputs/bin/vulkan-layouts --component-shaders target/component-shaders --component-only --metal-validator target/component-reference/zink-metal-pixels.dylib 2>&1 | tee target/components-metal-before.log; then
            echo 'Original component reference unexpectedly passed'
            exit 1
          fi
          python3 -c 'import json; from pathlib import Path; assert json.load(open("target/components-metal-before/results.json"))["passed"] is False; text=Path("target/components-metal-before/terminal.log").read_text(); assert "COMPONENT_EXIT:0:134" in text and any(x in text for x in ("vkCreateGraphicsPipelines", "vkWaitForFences"))'
      - uses: actions/cache/restore@v4
        if: steps.verify.outputs.native_runtime == ''
        id: moltenvk
        with:
          path: |
            target/moltenvk-patched/macos-arm64-*/libMoltenVK.a
            target/moltenvk-patched/macos-arm64-*/build.json
          key: ${{ runner.os }}-moltenvk-macos-v1-${{ hashFiles('scripts/vulkan-upstream.json', 'scripts/build-moltenvk.py', 'patches/moltenvk/**', 'crates/trames-vulkan/native/transform-feedback/**') }}
      - name: Run the same original mousepad dialog on native Metal
        if: steps.verify.outputs.native_runtime == ''
        run: |
          python3 scripts/prepare-vulkan.py --apple --source-build
          python3 scripts/build-moltenvk.py --verify-component-source target/vulkan-upstream/moltenvk-dependency-SPIRV-Cross.tar.gz
          python3 scripts/build-moltenvk.py --verify-sampler-source target/vulkan-upstream/moltenvk-source.tar.gz
          native_moltenvk_dir="$(python3 scripts/build-moltenvk.py --platform macos --arch arm64)"
          export TRAMES_MOLTENVK_STATIC_DIR="$native_moltenvk_dir" MACOSX_DEPLOYMENT_TARGET=12.0
          export RUSTFLAGS="-C link-arg=-framework -C link-arg=IOKit -C link-arg=$(xcrun clang --print-runtime-dir)/libclang_rt.osx.a"
          cargo build -p trames-ffi --release --locked
          xcrun clang -O2 -Wall -Wextra -Werror -fobjc-arc -dynamiclib tests/fixtures/zink-metal-pixels.m -framework Metal -framework Foundation -o target/zink-metal-pixels.dylib
      - uses: actions/cache/save@v4
        if: steps.verify.outputs.native_runtime == '' && steps.moltenvk.outputs.cache-hit != 'true'
        with:
          path: |
            target/moltenvk-patched/macos-arm64-*/libMoltenVK.a
            target/moltenvk-patched/macos-arm64-*/build.json
          key: ${{ runner.os }}-moltenvk-macos-v1-${{ hashFiles('scripts/vulkan-upstream.json', 'scripts/build-moltenvk.py', 'patches/moltenvk/**', 'crates/trames-vulkan/native/transform-feedback/**') }}
      - uses: actions/upload-artifact@v4
        with:
          name: dialog-metal-runtime
          path: |
            target/release/libtrames_ffi.dylib
            target/zink-metal-pixels.dylib
          retention-days: 7
      - name: Verify fixed component pixels and default original GPU save dialogs
        run: |
          export TRAMES_VULKAN_TRACE=1 MTL_DEBUG_LAYER=1 MVK_CONFIG_DEBUG=1
          unset TRAMES_DIALOG_NO_FEEDBACK TRAMES_DIALOG_ZINK_DEBUG TRAMES_DIALOG_GTK_CSD MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS
          python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:], timeout=180).returncode)' python3 tests/integration/xwayland-dialog.py --native-wsi --ffi target/release/libtrames_ffi.dylib --store target/xwayland-dialog-inputs/store --output target/dialog-metal-fixed --component-client target/xwayland-dialog-inputs/bin/vulkan-layouts --component-shaders target/component-shaders --metal-validator target/zink-metal-pixels.dylib 2>&1 | tee target/dialog-metal-fixed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xwayland-dialog-metal
          path: |
            target/dialog-metal-*/
            target/dialog-metal-*.log
            target/components-metal-before/
            target/components-metal-before.log
            target/moltenvk-patched/macos-arm64-*/build.json
          retention-days: 7
