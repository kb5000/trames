name: Publish Trames 1.2.0
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trames-ipad-release-1.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Release IPA, exact GPU libraries and paired GPL sources; publish immutable 1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-ios-release-1.2.py
